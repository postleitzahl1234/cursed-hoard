[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

  // Headless backend, used by SpriteExporter only (one-time PNG dump tool).
  implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

test {
  useJUnitPlatform()
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

/**
 * One-time PNG export of all hand-ported sprites into assets/sprites/.
 * Usage: ./gradlew core:exportSprites
 */
tasks.register('exportSprites', JavaExec) {
  group = 'tools'
  description = 'Dumps all hand-ported pixel-art sprites to assets/sprites/ as PNGs.'
  mainClass = 'io.github.some_example_name.sprites.SpriteExporter'
  classpath = sourceSets.main.runtimeClasspath
  workingDir = rootProject.projectDir
}

tasks.register('exportWaveTables', JavaExec) {
  group = 'tools'
  description = 'Seeds assets/waves from the procedural WavePlan fallback.'
  mainClass = 'io.github.some_example_name.game.WaveTableExporter'
  classpath = sourceSets.main.runtimeClasspath
  workingDir = rootProject.projectDir
}
